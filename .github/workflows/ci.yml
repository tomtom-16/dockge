name: Node.js CI - Dockge

on:
  push:
    branches: [master]
    paths-ignore:
      - '*.md'
  pull_request:
    branches: [master]
    paths-ignore:
      - '*.md'

permissions: {}

jobs:
  ci:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Disable autocrlf
        run: | # Mainly for Windows
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{matrix.node}}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check Typescript
        run: npm run check-ts

      - name: Check native modules
        run: npm run test:native && npm run test:compat

      - name: Check stack files and terminal environment
        run: npm run test:stack-files && npm run test:terminal-env

      - name: Check SQLite on Debian Trixie
        if: matrix.os == 'ubuntu-latest'
        run: docker build --target dependencies -f docker/Dockerfile.local .

      - name: Build
        run: npm run build:frontend
      # more things can be add later like tests etc..
